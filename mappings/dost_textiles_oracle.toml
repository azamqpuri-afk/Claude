# Mapping: Dost Textiles' ERP (Oracle 11.2, schema DOSTEX) -> Project Smart Layer standard model.
#
# Built from the tables and views the existing scripts in legacy/dost_textiles/
# already read and verified (STORE_ISSUE_V, STORE_RECEIPT_V, DMN, ACL, ACH,
# LOOMS, WV_PROD_V, WV_EFF_V, GET_ITEM_STOCK).
# NOT YET RUN against the live database: run `python -m smart_layer check` on
# the server first; it tests each entity separately and names any failing one.
#
# Covers the new ERP only (DOSTEX, from 1-Oct-2023). The old ERP (DOSTT) can
# be added later as a second mapping for history.

[mapping]
name = "Dost Textiles ERP (Oracle, DOSTEX)"

# DOSTEX.I is keyed on (ic, uc); like the existing stock scripts, items are taken per item code (ic)
[entities.items]
sql = """
SELECT ic AS item_code, MAX(idesc) AS item_name, MAX(uom) AS unit
FROM dostex.i GROUP BY ic
"""

# Stock from the ERP's own function (verified against SUM(qty) in 32_get_item_stock_verify.sql),
# for every item that moved in the last 13 months
[entities.stock_balances]
sql = """
SELECT x.ic AS item_code, SUM(dostex.get_item_stock(x.ic, TRUNC(SYSDATE) + 1, x.uc)) AS qty
FROM (SELECT DISTINCT d.ic, d.uc FROM dostex.ddt d
      JOIN dostex.dmn m ON m.trans_no = d.trans_no AND m.uc = d.uc
      WHERE m.dd >= ADD_MONTHS(TRUNC(SYSDATE), -13)) x
GROUP BY x.ic
"""

[entities.store_receipts]
sql = """
SELECT r.dno AS doc_no, TRUNC(r.dd) AS doc_date, m.feedd AS entered_at, r.ic AS item_code, r.qty AS qty,
       r.rate AS rate, r.total_amt AS amount, m.ac AS supplier_code, r.an AS supplier_name, m.bno AS supplier_bill_no
FROM dostex.store_receipt_v r JOIN dostex.dmn m ON m.trans_no = r.trans_no
WHERE r.dd >= :since
"""

[entities.store_issues]
sql = """
SELECT v.dno AS doc_no, TRUNC(v.dd) AS doc_date, m.feedd AS entered_at, v.ic AS item_code, v.qty AS qty,
       v.amount AS amount, v.cn AS issued_to
FROM dostex.store_issue_v v JOIN dostex.dmn m ON m.trans_no = v.trans_no
WHERE v.dd >= :since
"""

[entities.parties]
sql = """
SELECT ac AS party_code, an AS party_name,
       CASE WHEN ac LIKE '3003%' THEN 'customer' ELSE 'supplier' END AS party_type
FROM dostex.ach WHERE ac LIKE '3003%' OR ac LIKE '2001%'
"""

# Account groups from the chart's code structure (as used by the dashboard, 40_business_dashboard.py)
[entities.accounts]
sql = """
SELECT a.ac AS account_code, a.an AS account_name,
       -- AR Textile (account 300306004, a 3003 customer-side account) is a long-term payable (a loan), so it is
       -- reclassified to 'liability' to keep it OUT of Receivable / advances-received and show it under Accrued -
       -- giving a real receivables picture. Matched at a word boundary so names like "BAZAR TEXTILE" are not caught.
       -- To pin it exactly instead, use the code, e.g.  WHEN a.ac IN ('300306004', '300306009') THEN 'liability'
       CASE WHEN REGEXP_LIKE(a.an, '(^| )AR[ .]*TEXTILE', 'i') THEN 'liability'
            WHEN a.ac LIKE '300801%' THEN 'cash'
            WHEN a.ac LIKE '3008%'   THEN 'bank'
            WHEN a.ac LIKE '3003%'   THEN 'customer'
            WHEN a.ac LIKE '2001%'   THEN 'supplier'
            WHEN a.ac LIKE '35%'     THEN 'revenue'
            WHEN a.ac LIKE '40%' OR a.ac LIKE '45%' OR a.ac LIKE '55%' THEN 'expense'
            WHEN a.ac LIKE '10%'     THEN 'equity'      -- capital, reserves, partners' drawing
            WHEN a.ac LIKE '25%'     THEN 'asset'       -- fixed assets: plant, land, buildings, vehicles
            WHEN a.ac LIKE '30%'     THEN 'asset'       -- other current assets: stores, advances, taxes
            WHEN a.ac LIKE '20%'     THEN 'liability'   -- sales tax, accrued and other payables
            ELSE 'other' END AS account_group,
       CASE WHEN a.ac LIKE '3003%' OR a.ac LIKE '2001%' THEN a.ac END AS party_code,
       h.an AS head_name
FROM dostex.ach a LEFT JOIN dostex.ach h ON h.ac = SUBSTR(a.ac, 1, 6) AND LENGTH(a.ac) > 6
"""

# A voucher is (tbl, vt, vno, date), the grouping 70_erp_audit.py uses for its balance checks.
# FEEDD is selected as-is (one branch of ACL is not a date); non-dates become empty.
[entities.ledger_entries]
sql = """
SELECT l.tbl || '/' || l.vt || '/' || l.vno || '/' || TO_CHAR(l.vd, 'YYYYMMDD') AS voucher_id,
       TO_CHAR(l.vno) AS voucher_no, l.vt AS voucher_type,
       CASE WHEN l.vt IN ('CP', 'BP') THEN 'payment' WHEN l.vt IN ('CR', 'BR') THEN 'receipt'
            WHEN l.vt = 'JV' THEN 'journal' WHEN l.vt = 'OPN' THEN 'opening'
            -- real sales post through the fabric dispatch invoice (GPOUT / GPIN), purchases through the store GRN and sizing bill
            WHEN l.vt IN ('GPOUT', 'GPIN', 'OGP_YARN') THEN 'sale'
            WHEN l.vt IN ('SRN', 'IGP_YARN', 'IGP_SIZED_BEAMS') THEN 'purchase' ELSE 'other' END AS voucher_kind,
       TRUNC(l.vd) AS voucher_date, l.feedd AS entered_at, l.ac AS account_code, l.amt AS amount, l.usern AS entered_by
FROM dostex.acl l
WHERE (l.vt = 'OPN' OR l.vd >= :since) AND l.ac IS NOT NULL AND NVL(l.amt, 0) <> 0
"""

[entities.account_balances]
sql = """
SELECT ac AS account_code, SUM(amt) AS balance FROM dostex.acl WHERE ac IS NOT NULL GROUP BY ac
"""

[entities.looms]
sql = "SELECT lcode AS loom_code, lname AS loom_name FROM dostex.looms"

# Grades and meters from WV_PROD_V; efficiency from WV_EFF_V as the ERP's Loom Wise Efficiency report computes
# it (SUM(total_mtr) / SUM(eff_100)), matched on date, loom, shift and quality. Combined efficiency is weighted by
# eff_100 (meters at 100%), e.g. 1-Oct-2026: 2,223 / 2,805 = 79.25%.
# Grades as the ERP's own Daily Production report counts them: first = A + A2; rejection = everything else
# (B + C + CP, i.e. 100 - "Grade %"); second = B is kept separately for reference.
[entities.loom_production]
# Efficiency (WV_EFF_V) is joined on date + loom + shift ONLY, never quality. On a weft change the production row
# and the efficiency row carry different quality strings (e.g. 30/30 vs 31/34); joining on quality silently dropped
# those rows (~7.6% of the mill's meters-at-100).
# IMPORTANT: efficiency is computed ENTIRELY inside WV_EFF_V (its own meters / its own eff_100), so the numerator and
# denominator always share one meter basis. Mixing WV_PROD_V meters with WV_EFF_V's eff_100 is wrong - for multi-panel
# cloth (3-panel 46"/45") the two views count meters differently and the ratio inflates to ~3x (194%+ "efficiency").
# WV_PROD_V is used only for the meters column and to spread meters-at-100 across the shift's quality rows (in
# proportion to meters, so SUM over the rows = the shift's eff_100 and the combined efficiency is unchanged).
sql = """
SELECT prod_date, loom_code, shift, contract_no, quality, beam_no, meters, first_quality_m, second_quality_m, rejected_m,
       eff AS efficiency_pct,
       CASE WHEN sh_meters > 0 THEN m100 * meters / sh_meters ELSE m100 END AS meters_at_100
FROM (
  SELECT p.td AS prod_date, p.lcode AS loom_code, p.shift AS shift, p.cont_no AS contract_no, p.quality AS quality,
         p.beam AS beam_no, p.meters AS meters, p.first_q AS first_quality_m, p.second_q AS second_quality_m,
         p.rej AS rejected_m, SUM(p.meters) OVER (PARTITION BY p.td, p.lcode, p.shift) AS sh_meters,
         e.m100 AS m100, e.eff AS eff
  FROM (SELECT TRUNC(v.td) td, v.lcode, NVL(TO_CHAR(v.shift), '-') shift, v.quality, MAX(v.cont_no) cont_no,
               MAX(TO_CHAR(v.ref_tno)) beam, SUM(NVL(v.total_mtr, 0)) meters, SUM(NVL(v.a, 0) + NVL(v.a2, 0)) first_q,
               SUM(NVL(v.b, 0)) second_q, SUM(NVL(v.b, 0) + NVL(v.c, 0) + NVL(v.cp, 0)) rej
        FROM dostex.wv_prod_v v WHERE v.tt = 'PRODUCTION' AND v.td >= :since
        GROUP BY TRUNC(v.td), v.lcode, NVL(TO_CHAR(v.shift), '-'), v.quality) p
  LEFT JOIN (SELECT TRUNC(td) td, lcode, NVL(TO_CHAR(shift), '-') shift, SUM(eff_100) m100,
                    100 * SUM(total_mtr) / NULLIF(SUM(eff_100), 0) eff
             FROM dostex.wv_eff_v WHERE tt = 'PRODUCTION' AND td >= :since
             GROUP BY TRUNC(td), lcode, NVL(TO_CHAR(shift), '-')) e
    ON e.td = p.td AND e.lcode = p.lcode AND e.shift = p.shift
)
"""

# Contracts (DOSTEX.CONTM) as read by 48_contract_closing.py. warp_thread / weft_thread are taken as
# ends / picks per inch; counts come from the yarn master.
[entities.contracts]
sql = """
SELECT TO_CHAR(c.cont_no) AS contract_no, c.party_code AS party_code, a.an AS party_name, TRUNC(c.cont_date) AS contract_date,
       c.warp_thread AS ends_per_inch, c.weft_thread AS picks_per_inch, c.width AS width_in,
       TO_CHAR(c.warp_yarn_code) AS warp_yarn, wy.count AS warp_count,
       TO_CHAR(c.weft_yarn_code) AS weft_yarn, fy.count AS weft_count,
       -- construction, so beams of the same cloth share a learned shrinkage (beam report) and rejection pattern
       c.warp_thread || 'x' || c.weft_thread || ' ' || wy.count || '/' || fy.count || ' ' || c.width AS quality,
       c.cont_qty AS ordered_meters, c.conver_per_meter AS rate_per_meter, 'party' AS yarn_owner
FROM dostex.contm c LEFT JOIN dostex.ach a ON a.ac = c.party_code
LEFT JOIN dostex.yarn wy ON wy.ycode = c.warp_yarn_code LEFT JOIN dostex.yarn fy ON fy.ycode = c.weft_yarn_code
"""

# Yarn gate passes (WYTM / WYTD). Weight rule from 48_contract_closing.py: the typed kg is used only when it is
# plausible (15-60 kg a bag, ~5 kg a cone), otherwise bags x 45.36 kg (100 lb). A yarn OGP with a price in its
# description is mill yarn sold to the party, not a return.
[entities.yarn_movements]
sql = """
SELECT TRUNC(m.td) AS move_date, m.feedd AS entered_at, TO_CHAR(NVL(m.gp_no, m.tno)) AS doc_no,
       CASE m.tt WHEN 'IGP_YARN' THEN 'party_receipt'
                 WHEN 'OGP_YARN' THEN CASE WHEN REGEXP_LIKE(m.tdesc, '@ *[0-9]') THEN 'sale' ELSE 'party_return' END
                 WHEN 'TO_SIZING' THEN 'to_sizer' WHEN 'FROM_SIZING' THEN 'from_sizer'
                 WHEN 'IGP_SIZED_BEAMS' THEN 'sized_beams_received' WHEN 'OPN_SIZED_BEAMS' THEN 'opening'
                 WHEN 'YARN_TO_LOOMS' THEN 'to_looms' WHEN 'YARN_FROM_LOOMS' THEN 'from_looms' ELSE 'other' END AS move_type,
       TO_CHAR(d.ycode) AS yarn_code, y.yarn_desc AS yarn_name, TO_CHAR(c.cont_no) AS contract_no,
       NVL(m.ac1, m.ac2) AS party_code, a.an AS party_name, d.bags AS bags,
       CASE WHEN NVL(d.yarn_wt,0) > 0 AND ((NVL(d.bags,0) = 0 AND (NVL(d.cones,0) = 0 OR d.yarn_wt <= d.cones*5 + 5))
                                          OR (NVL(d.bags,0) > 0 AND d.yarn_wt BETWEEN d.bags*15 AND d.bags*60 + 60))
            THEN d.yarn_wt
            ELSE NVL(d.bags,0)*45.36 + NVL(d.cones,0)*45.36/NVL(NULLIF(d.cone_pbag,0), CASE WHEN y.count > 40 THEN 40 ELSE 24 END) END AS kg,
       m.usern AS entered_by
FROM dostex.wytm m JOIN dostex.wytd d ON d.trans_no = m.trans_no
LEFT JOIN dostex.yarn y ON y.ycode = d.ycode LEFT JOIN dostex.contm c ON c.cont_id = d.cont_id
LEFT JOIN dostex.ach a ON a.ac = NVL(m.ac1, m.ac2)
WHERE m.td >= :since
"""

# Fabric gate passes (FAB_GP_V): GPOUT = to the party, GPIN = returned. Fresh = A + A2, rejected = B + C + CP.
[entities.fabric_dispatches]
sql = """
SELECT TO_CHAR(NVL(v.gp_no, v.trans_no)) AS doc_no, TRUNC(v.trans_date) AS dispatch_date, TO_CHAR(c.cont_no) AS contract_no,
       s.quality AS quality, v.ac AS party_code, v.deliver_to AS deliver_to,
       CASE v.trans_type WHEN 'GPOUT' THEN 'out' ELSE 'in' END AS direction,
       SUM(NVL(v.a,0) + NVL(v.a2,0)) AS fresh_m, SUM(NVL(v.b,0) + NVL(v.c,0) + NVL(v.cp,0)) AS rejected_m,
       SUM(v.total_mtr) AS meters, SUM(v.amt) AS amount
FROM dostex.fab_gp_v v JOIN dostex.wc_cont_sub_v s ON s.cont_sub_id = v.cont_sub_id JOIN dostex.contm c ON c.cont_id = s.cont_id
WHERE v.trans_type IN ('GPOUT', 'GPIN') AND v.trans_date >= :since
GROUP BY NVL(v.gp_no, v.trans_no), TRUNC(v.trans_date), c.cont_no, s.quality, v.ac, v.deliver_to, v.trans_type
"""

# Fabric in stock exactly as the ERP's own FABRIC STOCK report shows it: WV_FAB_STOCK_V is a UNION of opening
# (FAB_OPN) + woven (PRODUCTION) - dispatched (GPOUT) + returns (GPIN). There is NO stored balance - the report
# is SUM(TOTAL_MTR) up to the date. We READ that same view (never recompute), so the total matches to the metre.
[entities.fabric_stock]
sql = """
SELECT s.cont_no AS contract_no, a.an AS party_name, s.quality AS quality,
       SUM(NVL(v.a,0) + NVL(v.a2,0)) AS fresh_m,
       SUM(NVL(v.b,0)) AS b_m, SUM(NVL(v.c,0)) AS c_m, SUM(NVL(v.cp,0)) AS cp_m,
       SUM(v.total_mtr) AS meters
FROM dostex.wv_fab_stock_v v
JOIN dostex.wc_cont_sub_v s ON s.cont_sub_id = v.cont_sub_id
JOIN dostex.contm c ON c.cont_id = s.cont_id
LEFT JOIN dostex.ach a ON a.ac = c.party_code AND a.uc = c.uc AND a.yc = c.yc
WHERE v.td <= :today
GROUP BY s.cont_no, a.an, s.quality
HAVING ABS(SUM(v.total_mtr)) > 0.001 OR ABS(SUM(NVL(v.b,0))) > 0.001
    OR ABS(SUM(NVL(v.c,0))) > 0.001 OR ABS(SUM(NVL(v.cp,0))) > 0.001
"""

# Count-wise loose-yarn stock, exactly as the mill's "Weft Stock Detail" / "Yarn Stock At Sizing" report.
# WEFT_YARN_V = the mill's own loose yarn (+IGP_YARN/REWIND/FROM_LOOMS/FROM_SIZING, -OGP_YARN/TO_LOOMS/TO_SIZING);
# WARP_YARN_V = yarn out at a sizer per party (incl. the sizer's SZ_OPN opening). Both carry signed BAGS/CONES
# per line with CONE_PBAG; stock is netted as total cones up to and including :today. Brand is YBRANDS.BNAME
# (a separate table, not on the yarn master); party is WYTM.AC1 -> ACH.AN on the full key (ac, uc, yc).
[entities.yarn_stock]
sql = """
SELECT 'weft' AS section, CAST(NULL AS VARCHAR2(120)) AS party_name,
       y.yarn_desc AS "count", b.bname AS brand, v.cone_pbag AS cone_pbag,
       SUM(NVL(v.bags * NVL(v.cone_pbag, 1), 0) + NVL(v.cones, 0)) AS qty_cones
FROM dostex.weft_yarn_v v
LEFT JOIN dostex.yarn y ON y.ycode = v.ycode
LEFT JOIN dostex.ybrands b ON b.bcode = v.bcode
WHERE v.td <= :today
GROUP BY v.ycode, y.yarn_desc, v.bcode, b.bname, v.cone_pbag
HAVING SUM(NVL(v.bags * NVL(v.cone_pbag, 1), 0) + NVL(v.cones, 0)) <> 0
UNION ALL
SELECT 'sizing' AS section, a.an AS party_name,
       y.yarn_desc AS "count", b.bname AS brand, v.cone_pbag AS cone_pbag,
       SUM(NVL(v.bags * NVL(v.cone_pbag, 1), 0) + NVL(v.cones, 0)) AS qty_cones
FROM dostex.warp_yarn_v v
LEFT JOIN dostex.ach a ON a.ac = v.ac AND a.uc = v.uc AND a.yc = v.yc
LEFT JOIN dostex.yarn y ON y.ycode = v.ycode
LEFT JOIN dostex.ybrands b ON b.bcode = v.bcode
WHERE v.td <= :today
GROUP BY v.ac, a.an, v.ycode, y.yarn_desc, v.bcode, b.bname, v.cone_pbag
HAVING SUM(NVL(v.bags * NVL(v.cone_pbag, 1), 0) + NVL(v.cones, 0)) <> 0
"""

# Beams (as 52_yarn_fabric_data.py / 60_beam_register.py read them).
# On looms: WV_BEAM_ATLOOM_V (ACTUAL_LENGTH = set length, BEAM_PROD = woven from it, BLENGTH = left).
# Sized and waiting: BEAMS_STOCK_V. Ends of each set from the sized-beam gate pass (WYTD.ENDS).
[entities.beams]
sql = """
SELECT v.beam_code AS beam_no, 'on_loom' AS status, TO_CHAR(v.set_no) AS set_no, TO_CHAR(v.cont_no) AS contract_no,
       TO_CHAR(v.lcode) AS loom_code, NULL AS sizer_name, e.ends AS ends, v.actual_length AS set_length_m, v.beam_prod AS woven_m,
       v.blength AS length_left_m, TRUNC(v.td) AS mounted_date, NULL AS received_date, v.bwidth AS bwidth
FROM dostex.wv_beam_atloom_v v
LEFT JOIN (SELECT b.setno, MAX(d.ends) ends FROM dostex.wybeams b JOIN dostex.wytd d ON d.trans_no = b.trans_no AND d.sr_no = b.ref_sr
           GROUP BY b.setno) e ON e.setno = v.set_no
UNION ALL
SELECT s.beam_code, 'sized_waiting', TO_CHAR(s.setno), TO_CHAR(s.cont_no), NULL, NULL, e.ends, s.blength, NULL, s.blength, NULL, NULL, NULL
FROM (SELECT DISTINCT beam_code, cont_no, blength, setno FROM dostex.beams_stock_v) s
LEFT JOIN (SELECT b.setno, MAX(d.ends) ends FROM dostex.wybeams b JOIN dostex.wytd d ON d.trans_no = b.trans_no AND d.sr_no = b.ref_sr
           GROUP BY b.setno) e ON e.setno = s.setno
"""

# Empty beams out with each sizer, from the ERP's own view (WV_EMPTY_BEAM_STOCK_V): +1 per empty beam sent out,
# -1 per empty or sized beam returned. One row per sizer (AN).
[entities.empty_beam_stock]
sql = """
SELECT v.an AS party_name, SUM(v.beams) AS beams
FROM dostex.wv_empty_beam_stock_v v
GROUP BY v.an HAVING SUM(v.beams) <> 0
"""

# Beam movements: sized beams (WYBEAMS + WYTM), empty beams to / from sizers (WV_GP_BEAMSM/D), beams on / off looms (WPRDTD).
# Fabric woven per beam = production booked against it (WPRDTD PRODUCTION rows reference the beam's REF_TNO / REF_SR).
[entities.beam_movements]
sql = """
SELECT TRUNC(m.td) AS move_date, TO_CHAR(NVL(m.gp_no, m.tno)) AS doc_no, bm.bcode AS beam_no,
       CASE m.tt WHEN 'IGP_SIZED_BEAMS' THEN 'sized_received' WHEN 'OPN_SIZED_BEAMS' THEN 'sized_received'
                 WHEN 'OGP_SIZED_BEAMS' THEN 'sized_sent_out' ELSE 'other' END AS move_type,
       a.an AS party_name, TO_CHAR(b.setno) AS set_no, TO_CHAR(c.cont_no) AS contract_no, NULL AS loom_code,
       b.blength AS length_m, NULL AS woven_m
FROM dostex.wybeams b JOIN dostex.wytm m ON m.trans_no = b.trans_no
JOIN dostex.wytd d ON d.trans_no = b.trans_no AND d.sr_no = b.ref_sr
LEFT JOIN dostex.contm c ON c.cont_id = d.cont_id LEFT JOIN dostex.beams bm ON bm.beam_id = b.beam_id
LEFT JOIN dostex.ach a ON a.ac = NVL(m.ac1, m.ac2)
WHERE m.td >= :since AND b.beam_id IS NOT NULL
UNION ALL
SELECT TRUNC(m.td), TO_CHAR(m.tno), bm.bcode,
       CASE m.tt WHEN 'OGP_EMPTY_BEAMS' THEN 'empty_to_sizer' WHEN 'IGP_EMPTY_BEAMS' THEN 'empty_from_sizer' ELSE 'other' END,
       a.an, NULL, TO_CHAR(c.cont_no), NULL, NULL, NULL
FROM dostex.wv_gp_beamsd d JOIN dostex.wv_gp_beamsm m ON m.trans_no = d.trans_no
LEFT JOIN dostex.beams bm ON bm.beam_id = d.beam_id LEFT JOIN dostex.contm c ON c.cont_id = d.cont_id
LEFT JOIN dostex.ach a ON a.ac = m.ac1
WHERE m.td >= :since
UNION ALL
SELECT TRUNC(m.td), TO_CHAR(m.tno), bm.bcode,
       CASE WHEN m.tt = 'BEAMS_TO_LOOM' THEN 'to_loom' WHEN d.bstatus = 'COMPLETE' THEN 'from_loom_finished' ELSE 'from_loom_cut' END,
       NULL, TO_CHAR(sb.setno), TO_CHAR(c.cont_no), TO_CHAR(d.lcode), sb.blength,
       CASE WHEN m.tt = 'BEAMS_FROM_LOOM' THEN pr.m END
FROM dostex.wprdtd d JOIN dostex.wprdtm m ON m.trans_no = d.trans_no
LEFT JOIN dostex.beams bm ON bm.beam_id = d.beam_id LEFT JOIN dostex.contm c ON c.cont_id = d.cont_id
LEFT JOIN dostex.wybeams sb ON sb.trans_no = d.ref_tno AND sb.sr_no = d.ref_sr
LEFT JOIN (SELECT d4.ref_tno, d4.ref_sr, SUM(NVL(d4.a,0)+NVL(d4.a2,0)+NVL(d4.b,0)+NVL(d4.c,0)+NVL(d4.cp,0)) m
           FROM dostex.wprdtm m4 JOIN dostex.wprdtd d4 ON d4.trans_no = m4.trans_no WHERE m4.tt = 'PRODUCTION'
           GROUP BY d4.ref_tno, d4.ref_sr) pr ON pr.ref_tno = d.ref_tno AND pr.ref_sr = d.ref_sr
WHERE m.tt IN ('BEAMS_TO_LOOM', 'BEAMS_FROM_LOOM') AND m.td >= :since
"""

# Loom scoreboard (OLMS, MS Access) as a second source - formulas from 74_scoreboard_data.py:
#   meters = picks x panels / (picks per inch x 39.37); efficiency = picks / (measured RPM x shift minutes).
# PSHFTDUR is in seconds (/60 -> minutes). A shift can be split into several rows, so everything is SUMmed per
# loom per day. Use the MEASURED PRPM, never PSTDRPM (wrongly 90 on many looms, which inflates efficiency past
# 100%). About 19% of rows have PRPM = 0 (a missing reading, not a stopped loom), which would blow the ratio up;
# those rows are excluded from the efficiency numerator and denominator (their meters still count).
# Needs [sources.scoreboard] in config.toml: driver = "access", path = 'E:\scoreboard_copy\OLMSDB_copy.mdb', copy_first = true
[entities.loom_monitor]
source = "scoreboard"
# Efficiency is run-time based: (shift time - stop time) / shift time, summed over the loom's records before
# dividing (a shift can be split across several records). PSHFTDUR and PTSTPDUR are both seconds. This matches the
# scoreboard exactly and works even when PRPM is 0 (night-shift records often have PRPM = 0, which the old
# PRPM-weighted formula could not handle - it understated or blanked those looms).
# NOTE: this runs on MS Access (Jet SQL), which rejects -- comments inside the query, so keep comments out here.
sql = """
SELECT PDATE AS read_date, PMACH AS loom_code,
       SUM(IIF(PPINCH > 0, PPROD * PDELV / (PPINCH * 39.37), 0)) AS meters,
       IIF(SUM(PSHFTDUR) > 0, 100 * (SUM(PSHFTDUR) - SUM(PTSTPDUR)) / SUM(PSHFTDUR), NULL) AS efficiency_pct,
       AVG(IIF(PRPM > 0, PRPM, NULL)) AS rpm, SUM(PWRP + PUD) AS stops, SUM(PSHFTDUR) AS shift_sec
FROM RTLSUM WHERE PDATE >= :since GROUP BY PDATE, PMACH
"""

# Raw per-stop log (OLMS LOOMSTAT) as a second source, for the sensor duplicate-timings / sensor-swap check.
# One row per loom stop: RMACH_NO = loom number, RSTOP_TIME = the second it stopped, RCUR_TIME = the second it
# restarted. RDATE is the shift date (the sync window filter). The twin check pairs looms that stop AND restart
# within a couple of seconds of each other; a stopped loom's sensor fitted on a running loom makes the scoreboard
# count one loom twice, so both numbers stop and restart on the same second.
# Same [sources.scoreboard] (MS Access OLMSDB_copy.mdb) as loom_monitor. Jet SQL rejects -- comments, so none here.
# OPEN (still-stopped) stops: OLMS rewrites RCUR_TIME to the current poll time, so every open stop shares one
# "restart" second. The check drops those live (any restart within a few seconds of the latest restart in the
# data), so they never create false twins; the stop is evaluated once it has really closed.
[entities.loom_stops]
source = "scoreboard"
sql = """
SELECT RDATE AS stop_date, RMACH_NO AS loom_code, RSTOP_TIME AS stop_time, RCUR_TIME AS restart_time
FROM LOOMSTAT WHERE RDATE >= :since AND RSTOP_TIME IS NOT NULL AND RCUR_TIME IS NOT NULL
"""

# ---------------------------------------------------------------------------------------------------------------
# Payroll (separate PAYROLL schema, readable by the dostex login) and the gate register.
# NOT YET RUN against the live database: run `python -m smart_layer check` on the server; it tests each entity
# separately and names any that fail, so a wrong column or join here is caught before it is trusted.
# Net pay was validated against salary voucher JV 4 of 30-Sep-2026 (earned + overtime - deductions).
# ---------------------------------------------------------------------------------------------------------------

# Employee master: EMP + the lookup tables for readable department / designation / shift names.
# dept_sub is grouped to one row per sub-department so an employee is never duplicated.
[entities.employees]
sql = """
SELECT e.emp_code AS emp_code, e.emp_name AS name, e.father_name AS father_name, e.nic_no AS cnic,
       dp.dept_name AS department, ds.sub_dept_name AS sub_department,
       CASE e.sec_code WHEN 1 THEN 'Admin' WHEN 2 THEN 'Factory' ELSE TO_CHAR(e.sec_code) END AS section,
       dg.desg_name AS designation, jt.job_type AS job_type, sh.shift_name AS shift, sg.seg_desc AS segment,
       TRUNC(e.doj) AS date_joining, e.emp_status AS status, TO_CHAR(e.sal_type) AS wage_type,
       e.salary AS monthly_salary, e.per_day_wage AS per_day_wage,
       CAST(NULL AS VARCHAR2(50)) AS bank, e.bank_acc_no AS bank_account, e.mobile AS mobile,
       e.eobi_no AS eobi_no, e.ss_no AS social_security_no, NVL(e.quit, 'N') AS quit
-- Department is EMP.SEC_CODE (the ERP's own EMP_V view joins emp.sec_code = dept.dept_code). SUB_DEPT_CODE is
-- reused across departments, so it is only meaningful together with SEC_CODE - never MAX(dept_code) on it alone.
FROM payroll.emp e
LEFT JOIN payroll.dept dp ON dp.dept_code = e.sec_code
LEFT JOIN payroll.dept_sub ds ON ds.dept_code = e.sec_code AND ds.sub_dept_code = e.sub_dept_code
LEFT JOIN payroll.desg dg ON dg.desg_code = e.desg_code
LEFT JOIN payroll.job_types jt ON TO_CHAR(jt.job_type_id) = e.job_type_id
LEFT JOIN payroll.shifts sh ON sh.shift_id = e.shift_id
LEFT JOIN payroll.segments sg ON sg.seg_id = e.seg_id
"""

# Attendance: the last day each employee was marked present (ATTENDANCE_TYPE = 'P'), used to tell who is actually
# working now. The employment status flag (EMP_STATUS) is only 'SP'/blank and QUIT is rarely filled, so "working
# now" is: not quit AND (present in the last ~45 days OR paid in the last ~2 months - which also catches a new
# joiner who has not had a salary run yet).
# The date column of PAYROLL.IN_OUT on this ERP is DATED (confirmed). If a future ERP names it differently and
# `check` reports this entity failing, change DATED here to the real column (no rebuild needed) - active staff then
# falls back to the paid-in-last-2-periods rule until it is correct, so nothing else breaks.
[entities.attendance]
# NOT bound to :since - attendance is a snapshot (each sync replaces it whole), so a short-window sync must still
# read a useful span or it would wipe the table. Always read the last 120 days of presence, regardless of the
# sync window, and keep each employee's most recent present day.
sql = """
SELECT emp_code, MAX(TRUNC(dated)) AS last_present
FROM payroll.in_out WHERE attendance_type = 'P' AND dated >= :today - 120
GROUP BY emp_code
"""

# Payroll per employee per pay period (mills pay twice a month: 1-15, 16-end). The real key is emp + fdate + tdate
# (DATED is always the 1st, so it does not identify the row). Net pay is CALCULATED, not stored:
#   net = SALM.EARNED_AMOUNT + OT (MANUAL_HOURS x OT_RATE) - SALD deductions (ALLOWANCE_DEDUCTION = 'D'),
# matched on emp + fdate + tdate. Validated to within rounding against salary voucher JV 4 (30-Sep-2026).
# A month with more than 2 periods is a duplicate payroll run - the wage-bill report flags it.
[entities.payroll]
sql = """
SELECT emp_code, period_start, period_end, pay_month, section, designation, worked_days, monthly_rate,
       earned, overtime, deductions, (NVL(earned,0) + NVL(overtime,0) - NVL(deductions,0)) AS net_pay, paid
FROM (
  SELECT s.emp_code AS emp_code, TRUNC(s.fdate) AS period_start, TRUNC(s.tdate) AS period_end,
         TO_CHAR(s.dated, 'YYYY-MM') AS pay_month,
         CASE s.section_code WHEN 1 THEN 'Admin' WHEN 2 THEN 'Factory' ELSE TO_CHAR(s.section_code) END AS section,
         dg.desg_name AS designation, s.emp_worked_days AS worked_days, s.gross_salary AS monthly_rate,
         s.earned_amount AS earned,
         (SELECT NVL(SUM(o.manual_hours * o.ot_rate), 0) FROM payroll.ot o
          WHERE o.emp_code = s.emp_code AND o.fdate = s.fdate AND o.tdate = s.tdate) AS overtime,
         (SELECT NVL(SUM(d.earned_amount), 0) FROM payroll.sald d
          WHERE d.emp_code = s.emp_code AND d.fdate = s.fdate AND d.tdate = s.tdate
            AND d.allowance_deduction = 'D') AS deductions,
         s.paid AS paid
  FROM payroll.salm s
  LEFT JOIN payroll.desg dg ON dg.desg_code = s.desg_code
  WHERE s.tdate >= :since
)
"""

[entities.employee_loans]
# Open balance is CALCULATED, not stored: LOAN_COMPLETED is never set and LOAN_OPENING/ADJ_AMT are always 0.
#   remaining = LOAN_AMOUNT - repaid, where repaid = SUM(SALD.EARNED_AMOUNT) for ALLOWANCE_DEDUCTION = 'D',
#   matched on LOAN_CODE + LOAN_TYPE + EMP_CODE (codes restart per type, so all three are needed). EMP_PAY_REC
#   cash receipts are deliberately ignored - the only rows are pre-go-live (2023) with old employee numbers whose
#   loan codes clash with today's loans. Validated: every loan/advance is exactly repaid except loan 243.
sql = """
SELECT l.loan_code AS loan_code, TRUNC(l.loan_date) AS loan_date, l.emp_code AS emp_code,
       l.loan_type AS loan_type, l.loan_amount AS amount, l.installment_amount AS installment,
       l.loan_opening AS opening,
       (SELECT NVL(SUM(d.earned_amount), 0) FROM payroll.sald d
        WHERE d.loan_code = l.loan_code AND d.loan_type = l.loan_type AND d.emp_code = l.emp_code
          AND d.allowance_deduction = 'D') AS repaid,
       l.loan_completed AS completed, l.remarks AS remarks
FROM payroll.emp_loans l WHERE l.loan_date >= :since
"""

# The gate register: GATE_REG_V (store / fabric / yarn / sizing, the 10 types) UNION the beam gate passes that the
# view leaves out (empty beams to/from the sizer, and sized beams received). gatepass_id = type + number + date, so
# the same number across different types or years never clashes. Beam branches are keyed strictly within their own
# tables (WV_GP_BEAMS* vs WYT*) because the two share TRANS_NO values that belong to different transactions.
[entities.gate_passes]
sql = """
SELECT g.dt || '-' || TO_CHAR(g.gp_no) || '-' || TO_CHAR(g.gp_date, 'YYYYMMDD') AS gatepass_id,
       TO_CHAR(g.gp_no) AS gp_no, TRUNC(g.gp_date) AS gp_date,
       CASE g.mt WHEN 'I' THEN 'in' ELSE 'out' END AS direction,
       CASE g.dt WHEN 'GPOUT' THEN 'OGP fabric' WHEN 'GPIN' THEN 'IGP fabric'
                 WHEN 'IGP_YARN' THEN 'IGP yarn' WHEN 'OGP_YARN' THEN 'OGP yarn'
                 WHEN 'TO_SIZING' THEN 'Yarn to sizing' WHEN 'FROM_SIZING' THEN 'Yarn from sizing'
                 WHEN 'SRN' THEN 'Store GRN' WHEN 'IN' THEN 'Store returnable in'
                 WHEN 'OUT' THEN 'Store returnable out' WHEN 'SAL' THEN 'Store sale' ELSE g.gname END AS type,
       g.ac AS party_code, g.party AS party_name, g.vehicle AS vehicle, g.driver AS driver,
       g.ic AS item_code, g.item AS item, g.qty AS qty, g.uom AS uom,
       g.bags AS bags, g.cones AS cones, g.cone_pbag AS cone_pbag, g.thaan AS thaan,
       CAST(NULL AS VARCHAR2(50)) AS contract_no, CAST(NULL AS VARCHAR2(50)) AS beam_no, g.usern AS entered_by
FROM dostex.gate_reg_v g WHERE g.gp_date >= :since
UNION ALL
SELECT 'EB-' || m.tt || '-' || m.gp_no || '-' || TO_CHAR(m.gp_date, 'YYYYMMDD'),
       m.gp_no, TRUNC(m.gp_date), CASE WHEN m.tt = 'OGP_EMPTY_BEAMS' THEN 'out' ELSE 'in' END,
       CASE m.tt WHEN 'OGP_EMPTY_BEAMS' THEN 'Empty beam to sizer'
                 WHEN 'IGP_EMPTY_BEAMS' THEN 'Empty beam back' ELSE m.tt END,
       m.ac1, a.an, m.vehicle, m.driver,
       CAST(NULL AS VARCHAR2(50)), CAST(NULL AS VARCHAR2(200)), CAST(NULL AS NUMBER), 'beam',
       CAST(NULL AS NUMBER), CAST(NULL AS NUMBER), CAST(NULL AS NUMBER), CAST(NULL AS NUMBER),
       CAST(NULL AS VARCHAR2(50)), d.beam_code, m.usern
FROM dostex.wv_gp_beamsm m
JOIN dostex.wv_gp_beamsd d ON d.trans_no = m.trans_no
LEFT JOIN dostex.ach a ON a.ac = m.ac1
WHERE m.tt IN ('OGP_EMPTY_BEAMS', 'IGP_EMPTY_BEAMS') AND m.gp_date >= :since
UNION ALL
SELECT 'SB-' || m.tt || '-' || m.gp_no || '-' || TO_CHAR(m.gp_date, 'YYYYMMDD'),
       m.gp_no, TRUNC(m.gp_date), 'in', 'Sized beam in',
       NVL(m.ac1, m.ac2), a.an, m.vehicle, m.driver,
       CAST(NULL AS VARCHAR2(50)), CAST(NULL AS VARCHAR2(200)), CAST(NULL AS NUMBER), 'beam',
       CAST(NULL AS NUMBER), CAST(NULL AS NUMBER), CAST(NULL AS NUMBER), CAST(NULL AS NUMBER),
       TO_CHAR(c.cont_no), b.bcode, m.usern
FROM dostex.wytm m
JOIN dostex.wytd d ON d.trans_no = m.trans_no
JOIN dostex.wybeams b ON b.trans_no = m.trans_no AND b.ref_sr = d.sr_no
LEFT JOIN dostex.contm c ON c.cont_id = d.cont_id
LEFT JOIN dostex.ach a ON a.ac = NVL(m.ac1, m.ac2)
WHERE m.tt = 'IGP_SIZED_BEAMS' AND m.gp_date >= :since
"""
