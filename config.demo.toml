# Demo installation: the fictional Sitara Weaving mill on the demo "MillPro" ERP.
#   python demo/build_demo_erp.py
#   python -m smart_layer -c config.demo.toml sync

[company]
name = "Sitara Weaving (demo)"
currency = "Rs"

[erp]
driver = "sqlite"
path = "demo/demo_erp.db"
mapping = "mappings/demo_sqlite.toml"

[store]
path = "data/demo_store.db"

[sync]
history_days = 400

[notify]
channels = ["console"]

[reports]
output_dir = "output/demo"

[ask]
notes = """
Voucher types: CPV cash payment, BPV bank payment, CRV cash receipt, BRV bank receipt, JV journal, SV sales, OPN opening.
Issues go to looms (LOOM-01 .. LOOM-24) or departments (SIZING, FOLDING, GENERAL).
"""

# The mill's own closing method. Every value here is the mill's choice.
[closing]
divisor = 840
bag_lb = 100
basis = "dispatched"               # dispatched | woven
rejection_charged_to = "mill"      # mill | party
wastage_allowance_pct = 1

[closing.yarns.Y60]
rate_per_lb = 650
[closing.yarns.Y40]
rate_per_lb = 550
closing_count = 39                 # this mill closes 40s at 39
[closing.yarns.Y20]
rate_per_lb = 330

# Kohinoor's contracts are closed their way: divisor 800, 2% allowance
[[closing.parties]]
match = "Kohinoor"
divisor = 800
wastage_allowance_pct = 2

[pilferage]
lookback_days = 90
sizing_loss_pct = 6

[beams]
warn_days = 5
urgent_days = 3
