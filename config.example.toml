# Project Smart Layer by Azam Puri - example settings. Easiest: run  python -m smart_layer setup  which writes
# config.toml for you. Or copy this file to config.toml and fill it in. See examples/ for a real mill's settings.
# Passwords and keys are in .env next to this file. Edit values here any time; re-run the wizard to start over.

[company]
name = "My Mill"
currency = "Rs"

[erp]
driver = "oracle"                  # oracle | mssql | mysql | postgres | sqlite
dsn = "localhost:1521/ORCL"        # host:port/service, or a TNS name
user = "smartlayer_ro"             # a read-only database user
password = "${ERP_PASSWORD}"       # the password itself goes in .env
thick = true                       # Oracle 11g and older need Oracle Client mode
# client_lib_dir = 'C:\oracle\instantclient_19_x'
# tns_admin = 'C:\oracle\network\admin'
mapping = "mappings/<this mill's ERP>.toml"

[store]
path = "data/smart_layer.db"

[sync]
history_days = 400
# The dashboard shows "Last synced" in red, and pushes one ntfy alert, when a sync is overdue - so a silently
# stopped scheduled task is noticed, not found by chance.
# stale_live_minutes = 30
# stale_daily_hours = 26
# stale_alert_minutes = 90

[serve]
host = "0.0.0.0"
port = 8080
password = "${DASHBOARD_PASSWORD}"

[notify]
channels = ["console", "ntfy"]
ntfy_topic = "${NTFY_TOPIC}"
# quiet_from / quiet_to: hours 0-23. Non-urgent pushes (new production, morning summary) are held during this
# window and sent when it ends - nothing is lost. Leave unset for no quiet hours. Example: 22 to 6 = overnight.
# quiet_from = 22
# quiet_to = 6

[dashboard]
animations = true       # Overview "what changed" animations on each 5-minute auto-refresh
show_amounts = true     # show money amounts (set false to hide them on a shared office screen)
refresh_seconds = 300   # auto-refresh interval (aligned to the live sync)
sound = false           # play a sound on changes
colour_scheme = "teal"  # default palette: teal | indigo | copper | madder | olive | navy (the 🎨 picker overrides per browser)

[reports]
tracked_issue_days = 60
reorder_cover_months = 2
unused_stock_months = 6            # the Unused-stock tab flags items in stock but not issued for this many months
# combine_counts: nominal yarn counts that are really the same yarn, grouped so the yarn-shortage report does not
# treat them as separate (e.g. 52/1 and 54/1). The smallest count names the group. It may also live in a [yarn]
# section (a [yarn] combine_counts wins over this one).
# combine_counts = [[52, 54]]
# Where saved reports (PDF/CSV) are written. Leave blank for the per-machine default
# (Windows: C:\ProgramData\Smart Layer\output - Program Files is read-only). Point it at a synced
# OneDrive / Google-Drive-for-desktop folder to get the files in the cloud; Smart Layer uses no cloud API.
output_dir = ""
retention_weeks = 26               # delete saved report files older than this (0 = keep everything)
attach_pdf = true                  # attach the report PDF to its ntfy push (the owner gets it on the phone)
# attach_pdf_by_report = { weekly-beams = true, demand = false }   # per-report override
# demand_used_days = 180           # store demand: "still in use" window
# demand_avg_days = 90             # ... average-use window
# demand_zero_days = 60            # ... zero-quantity demand-slip window

[audit]
large_payment = 500000
duplicate_payment_min = 5000
# Practices the owner confirms as normal are kept out of alerts, e.g.
# dismiss = [{ match = "^big-", why = "advance payments to sizers are normal" }]

# The mill's own contract-closing method - set these with the owner.
[closing]
divisor = 840                      # many mills use 800
bag_lb = 100
basis = "dispatched"               # dispatched (net of returns) | woven
rejection_charged_to = "mill"      # mill: party pays yarn for fresh meters only | party: all meters
wastage_allowance_pct = 0
yarn_groups = []                   # e.g. [["6", "18"]] when one yarn is booked under two codes
# Physical rejection count. The ERP marks only these grades as rejection, so its "fresh stock" runs high; when the
# mill enters a physical count (Weaving > Closing > Fabric counts) the closing uses the counted rejection instead,
# rolled forward by production and dispatch since the count date. rejection_grades names the ERP's rejection grades.
# rejection_grades = ["C", "CP"]
# erp_start_date = "2023-01-01"    # contracts older than this (pre go-live) are left out of the fresh-stock top-up
# weight_formula = "threads_per_inch * width_in * 1.0936 / divisor / count"
# [closing.yarns."<yarn code>"]
# warp_closing_count = 38
# weft_closing_count = 39
# rate_per_lb = 550

[sizing]
gullay_g = 55            # grams of yarn left on each returned baby cone (gullay), for the sized-yarn closing count
pick_factor = 1.0936     # picks-per-metre factor used in the closing weight formula
shrink_pct = 7           # default sizing shrinkage % (metres after shrink); per-set input overrides it in the sheet

# Gully / rewind-yarn tracking (Yarn & Fabric -> Gully / Rewind). A sized beam comes back with gully (yarn left on
# the returned cones). The ERP records the gully weight on the sized-beam receipt (the per-set gullay_kg) but not
# the rewind: the mill rewinds it and re-uses it - back to SIZING for some yarns, as WEFT for others. This tracks a
# per-yarn book balance = opening + gully returned (net of the empty cones/tubes) - rewound re-used - waste, against
# a later physical count. All generic: yarn labels, move types and the route come from config / the mapping.
[gully]
# Per-yarn reuse route. "default" is the fallback; name a yarn (matched as a substring) to override it.
reuse_to = { default = "weft" }
# reuse_to = { "30/1 PC" = "sizing", default = "weft" }
# move_type values (as the yarn_movements mapping emits them) used to find each flow:
# to_sizing_types = ["to_sizer"]        # yarn sent to the sizer
# party_receipt_types = ["party_receipt"]  # fresh party-yarn receipts (a to-sizing line matching one is FRESH, not rewound)
# weft_issue_types = ["to_looms"]       # yarn issued to the looms as weft
# match_days = 3           # a to-sizing line within this many days of a fresh receipt ...
# match_tolerance_pct = 1  # ... and this % on kg is treated as fresh (the owner's tick on a line always wins)
# waste_pct = 0            # rewind waste as a % of gully returned, until the owner enters a measured figure
# Empty gully cones (tubes) are part of the gully weight; net rewind yarn = gully kg − cones × cone weight.
# The gully-cone count is taken from the set record itself (bags × cones_per_bag + loose_cones).
# cone_weight_kg = 0.060                 # weight of one empty cone/tube (kg)
# cone_weight_by_yarn = { "30/1 PC" = 0.060 }
# default_gully_cones = { "30/1 PC" = 1400 }   # per-yarn fallback count for old sets with no cone detail on the record
# Yarn-ledger data check (flagged in the Gully view): a line with bags but a missing / implausible weight.
# weight_ratio_low = 0.5                 # flag if kg / (bags × bag_kg) is below this ...
# weight_ratio_high = 2.0                # ... or above this
# For an opening entered as bags + cones rather than kg:
# bag_kg = 45.359237                     # one bag = 100 lb
# cone_pbag = { "30/1 PC" = 24 }         # cones per bag (else taken from the yarn stock)

[cost]
# Map a ledger account_group or head name to a cost bucket for the cost-per-metre report.
# Buckets: store | payroll | power | sizing | other. Example:
# heads = { "Electricity" = "power", "Wages" = "payroll", "Store consumption" = "store" }
heads = {}
# A month counts as "closed" (its month-end entries posted) when ALL of these buckets are > 0 — the cost-per-metre
# headline and averages use only closed months, so a part-posted current month never misleads. Default: store + payroll.
# closed_requires = ["store", "payroll"]

[monitor]
# Loom-monitor (scoreboard) efficiency. Looms listed here are left OUT of the shed / mill scoreboard average
# everywhere it is shown (the Overview tile, the Weaving tab, the morning summary) - use it for retired or
# permanently-idle looms whose 0% would drag the shed figure down the way the physical scoreboard does not.
# exclude_looms = [10, 12]
auto_exclude_idle = true   # also drop looms with no production AND stopped the whole shift from the LIVE tile

[edits]
# ERP edit history -> the Edits tab. Needs the optional change-history entities (erp_change_events,
# erp_change_values) mapped - a small layer the ERP can be made to write (e.g. Oracle triggers into a locked
# AUDIT_HIST schema). With them, the Edits tab lists every insert / edit / delete; without them there is simply
# no Edits tab. All generic - the SQL lives in the mapping, only labels/thresholds are here.
push_older_than_days = 2     # phone-push every DELETE, and any EDIT of an entry older than this many days
old_edit_days = 2            # highlight edits of entries older than this many days in the Edits tab
pair_minutes = 5             # "deleted then re-entered" hint: a delete + insert of the same line within this
# generic_users = ["DOSTEX"] # ERP logins that are really the DB owner (not a person) - show the PC/host instead
# amount_keywords = []       # EXTRA column-name fragments to treat as money/qty/rate on top of the built-in set
# ERP system routines (e.g. nightly average-rate re-rating): collapsed to one muted "ERP routine" line in the Edits
# tab and never phone-pushed, so a person's real edits stand out. Matched by Oracle MODULE, or an update whose only
# changed column(s) are listed in system_columns.
# system_modules = ["UPDATE_AVG_RATE"]
# system_columns = ["AVG_RATE"]
# Real-PC attribution. When the ERP records the Forms server as the host, the true client PC can be recovered from
# the WebLogic access log by matching the edit's time to the request. Point weblogic_access_log at the log (a glob is
# fine); map IPs to friendly names in ip_names; server_hosts lists the recorded hosts that really mean "the server".
# weblogic_access_log = "C:/Oracle/Middleware/.../logs/access.log*"
# ip_names = { "192.168.18.177" = "STORE-PC", "192.168.18.42" = "ACCOUNTS-PC" }
# server_hosts = ["DESKTOP-KUMU41H", "127.0.0.1", "localhost"]
# [edits.table_names]        # friendly area name per ERP table code (defaults cover TM/TD/DMN/DDT)
# TM = "Voucher"
# TD = "Voucher line"
# DMN = "Store document"
# DDT = "Store line"
# [edits.line_parent]        # which header table a detail-line table joins to for its document no / date / user
# TD = "TM"
# DDT = "DMN"

[pilferage]
lookback_days = 90
excess_kg = 400
sizing_loss_pct = 6

[beams]
# The mill's OWN sizing units - empty beams sent to these are never flagged as "not back".
# Matched as a substring, so a short name here matches the full party name on the gate pass
# (e.g. "Hiba" matches "HIBA FABRICS").
# own_beam_sizers = ["Hiba"]

# Loom sensor duplicate-timings (sensor-swap) check. Needs the loom_stops entity mapped (the monitor's raw
# per-stop log). With no layout it checks EVERY pair of looms on the timing rules alone; add a floor layout to
# grade pairs by nearness (only neighbouring / near pairs can be confirmed). Runs on every live sync, 24/7, and
# pushes via ntfy only on a confirmed episode.
[sensor]
# tol_seconds = 2          # two looms "twin" if they stop AND restart within this many seconds
# min_twins = 5            # an episode needs this many twin stops to be confirmed
# min_share = 0.60         # ... and that must be this share of the smaller loom's stops in the episode
# stale_hours = 2          # push once if the monitor's newest stop is older than this (gone blind)
# Floor layout (optional). [sensor.sheds.<shed>] columns = [[looms in column 0, top to bottom], [column 1], ...]
# [sensor.sheds.1]
# columns = [[2, 4, 6, 8, 10, 12, 14, 16, 18], [1, 3, 5, 7, 9, 11, 13, 15, 17]]
# [sensor.sheds.2]
# columns = [[20, 22, 24, 26, 28, 30, 32, 34, 36], [19, 21, 23, 25, 27, 29, 31, 33, 35]]

[yarn]
# Yarn counts that are the same yarn commercially and should appear as ONE line in the
# count-wise stock list. Each entry is [display label, count, count, ...]. Totals are summed,
# never recomputed.
# combine_counts = [["52/1 & 54/1 CTN", "52/1 CTN", "54/1 CTN"]]

[ask]
model = "claude-opus-5-5"
effort = "high"
notes = """
Describe the mill's voucher types, departments and anything special about its ERP here, for the chat assistant.
"""
